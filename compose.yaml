services:
  harmon:
    image: heraclitoqsaldanha/harmon-server:latest
    container_name: harmon
    restart: unless-stopped
    working_dir: /app
    networks:
      - webnet
    env_file:
      - .env
    environment:
      - SERVER_ADDR=0.0.0.0
      - SERVER_PORT=6565
      - CONFIG_PATH=/app/config.toml
      - DATABASE_URL=sqlite:///app/data/database.db
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./icon.png:/app/icon.png:ro
      - harmon:/app/data
  harmon-bridge:
    image: heraclitoqsaldanha/harmon-discord-bridge:latest
    container_name: harmon-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bridge-config.json:/source/config.json

volumes:
  harmon:

networks:
  webnet:
    name: webnet
